---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {%- include post-meta.html post=page -%}
  </header>

  <div class="content">
    {{ content }}
  </div>

  <nav class="post-nav">
    {%- if page.previous %}
    <a class="prev" href="{{ page.previous.url | relative_url }}">
      <span>Previous</span>{{ page.previous.title }}
    </a>
    {%- endif %}
    {%- if page.next %}
    <a class="next" href="{{ page.next.url | relative_url }}">
      <span>Next</span>{{ page.next.title }}
    </a>
    {%- endif %}
  </nav>
</article>
