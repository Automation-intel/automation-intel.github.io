<footer class="site-footer">

      &copy; {{ 'now' | date: "%Y" }} {{ site.author }}.
      Built with <a href="https://jekyllrb.com/">Jekyll</a> and published with GitHub Pages.
    </p>
    <p class="footer-links">{% if site.github_username %}<a href="https://github.com/{{ site.github_username }}">GitHub</a> &middot; {% endif %}{% if site.email %}<a href="mailto:{{ site.email }}">Email</a> &middot; {% endif %}<a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </div>
</footer>
