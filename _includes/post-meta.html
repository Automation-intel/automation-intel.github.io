<p class="post-meta">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time>
  {%- if include.post.tags and include.post.tags.size > 0 %}
  <span class="tag-list">
    {%- for tag in include.post.tags %}
    <a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>
    {%- endfor %}
  </span>
  {%- endif %}
</p>
